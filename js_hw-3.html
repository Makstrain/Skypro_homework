    <script>
        console.log("Скрипт загружен!"); // Проверка в консоли

        // ====================
        // Задание 1: Проверка пароля
        // ====================
        let password = 'пароль';
        let userPassword = prompt("Введите пароль");
        
        if (userPassword == password) {
            alert("Пароль введен верно!");
        } else {
            alert("Пароль введен неверно!");
        }

        // ====================
        // Задание 2: Проверка числа

        /*

        */

        // ====================
        // Задание 4: Сложение чисел из строк
        // ====================
        let a = '2';
        let b = '3';
        // Код выше изменять менять нельзя. Чтобы решить задачу исправьте код ниже:
        alert("Задание 4: Сумма a и b = " + (Number(a) + Number(b)));

        // ====================
        // Задание 5: Определение времени года
        // ====================
        let monthNumber = Number(prompt('Введите номер месяца в году'));

        switch (monthNumber) {
            case 1:
            case 2:
            case 12:
                alert("Зима");
                break;
                
            case 3:
            case 4:
            case 5:
                alert("Весна");
                break;
                
            case 6:
            case 7:
            case 8:
                alert("Лето");
                break;
                
            case 9:
            case 10:
            case 11:
                alert("Осень");
                break;
                
            default:
                alert("Некорректный номер месяца! Введите число от 1 до 12.");
        }
    </script>
