                function isPositive(number) {
                    return number > 0;
                }

                function isMale(person) {
                    return person.gender === 'male';
                }

                function filter(arr, ruleFunction) {
                    const output = [];

                    for (let i = 0; i < arr.length; i++) {
                        if (ruleFunction(arr[i])) {
                            output.push(arr[i]);
                        }
                    }

                    return output;
                }

                // Тестирование
                console.log(filter([3, -4, 1, 9], isPositive)); // [3, 1, 9]

                ];

                console.log(filter(people, isMale));
   
                  // Задание 3
             function printDates30() {
                let elapsedTime = 0;
                
                // Функция для вывода текущей даты
                function printCurrentDate() {
                    const now = new Date();
                    console.log(now.toLocaleString());
                }
                
                // Сразу выводим первую дату
                printCurrentDate();
                elapsedTime += 3;
                
                // Устанавливаем интервал для вывода даты каждые 3 секунды
                const intervalId = setInterval(() => {
                    printCurrentDate();
                    elapsedTime += 3;
                    
                    // Проверяем, 30 секунд
                    if (elapsedTime >= 30) {
                        clearInterval(intervalId);
                        
                        // setTimeout 
                        const remainingTime = (30 - elapsedTime + 3) * 1000;
                        setTimeout(() => {
                            console.log("30 секунд прошло");
                        }, remainingTime);
                    }
                }, 3000);
            }
            printDates30();
