         // Задание 12
         // Функция формирования случайных строк
          console.log("Задание 12"); 
           function randomLetters(length = 8) {
            const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz';
            let result = '';
            
            for (let i = 0; i < length; i++) {
                result += letters[Math.floor(Math.random() * letters.length)];
            }
            
            return result;
        }
         /// Функция формирует массив случайных строк разной длины
          function stringArray (arrayLength)
          {
         const arrayString = [];
          for (let i = 0; i < arrayLength ; i++)
          {
            arrayString.push(randomLetters(i+10))
          }
          return arrayString;
           }

        function stringToLength (arrayString)
        {
           return arrayString.map(item => (item.length));
        }

          console.log("Задание 13"); 
           function getNumArray(max,min,length) {

            let result = [];
            
            for (let i = 0; i < length; i++) {
                const randomNum = Math.floor(Math.random() * (max-min+1))+min;
                result.push(randomNum)
            }
            
            return result;
        }

             function getAverage(array) {
