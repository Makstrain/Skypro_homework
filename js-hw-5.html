            /// Задание 5   
               console.log("Задание5"); 
            function multiplyNumbers(num1, num2) {
             if (isNaN(Number(num1)) || isNaN(Number(num2))) {
             return 'Одно или оба значения не являются числом';
            }
             return num1 * num2;
            }
      // Примеры использования:
            console.log(`multiplyNumbers(5, 3) = ${multiplyNumbers(5, 3)}`);          // 15
            console.log(`multiplyNumbers(-2, 7) = ${multiplyNumbers(-2, 7)}`);       // -14
            console.log(`multiplyNumbers(0, 10) = ${multiplyNumbers(0, 10)}`);       // 0
            console.log(`multiplyNumbers(2.5, 4) = ${multiplyNumbers(2.5, 4)}`);     // 10
            console.log(`multiplyNumbers("5", "3") = ${multiplyNumbers("5", "3")}`); // 15
            console.log(`multiplyNumbers("abc", 3) = ${multiplyNumbers("abc", 3)}`); // 'Одно или оба значения не являются числом'
            console.log(`multiplyNumbers(null, 5) = ${multiplyNumbers(null, 5)}`);   // 0
       

            // Задание 6 - куб 
            function cube(num, showAlert = false) {
                // Проверяем, является ли введенное значение NaN (не числом)
                if (isNaN(Number(num))) {
                    if (showAlert) {
                        alert("Переданный параметр не является числом");
                    }
                    return "Переданный параметр не является числом";
                } else {
                    const result = Math.pow(Number(num), 3);
                    if (showAlert) {
                        alert(`n в кубе равняется ${result}`);
                    }
                    return result;
                }
            }

                }
            } while (isNaN(Number(userInput)) || userInput === "" || userInput === null);
